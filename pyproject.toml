[project]
name = "fraud-ws"
version = "0.1.0"
description = "Weak supervision (Snorkel-style label model) on Kaggle datasets with hidden labels: card fraud and SMS spam"
readme = "README.md"
authors = [
    { name = "plwg", email = "56353330+plwg@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "kagglehub>=0.3",
    "polars>=2.0.0",
    "scikit-learn>=1.5",
    "ws-labelmodel",
]

[project.scripts]
fraud-ws = "fraud_ws:main"
spam-ws = "spam_ws:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["fraud_ws", "spam_ws"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ws-labelmodel = { workspace = true }
